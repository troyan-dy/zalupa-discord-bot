[project]
name = "zalupa-discord-bot"
version = "0.1.0"
description = ""
authors = [{ name = "troyan-dy", email = "troyan-dy@sber-zvuk.com" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "discord.py>=2.7.1,<3",
    "certifi>=2026.10.23",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "loguru>=0.7.3,<0.8",
    "sentry-sdk>=2.73.0,<3",
    "uvloop>=0.23.0,<0.24",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.2"
mypy = "^2.4.0"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
